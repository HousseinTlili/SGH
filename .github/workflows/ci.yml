name: CI

# Merge to main only through a pull request (CLAUDE.md): these jobs are the gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Service copies match contracts/openapi
        run: ./scripts/check-contracts.sh
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@1 lint contracts/openapi/*.yaml

  # The Node services share one shape: PostgreSQL for the tests, the repository's RabbitMQ topology
  # so the broker tests run instead of skipping.
  node-service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [doctor-service, reception-service, pharmacy-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: sgh
          POSTGRES_PASSWORD: sgh_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Start RabbitMQ from infra/docker-compose.yml
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --wait rabbitmq
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  spring-service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [patient-service, staff-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: sgh
          POSTGRES_PASSWORD: sgh_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test

  lab-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lab-service
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: sgh
          POSTGRES_PASSWORD: sgh_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lab-service/requirements.txt
      - name: Start RabbitMQ from infra/docker-compose.yml
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --wait rabbitmq
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
