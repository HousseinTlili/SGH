<div *appServiceGate="'patient'">
  <app-page-header title="Patients" subtitle="Manage registered patients and demographics">
    @if (canCreate) {
      <button mat-flat-button color="primary" type="button" (click)="onCreate()">
        <mat-icon>add</mat-icon>
        New patient
      </button>
    }
  </app-page-header>

  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search patients</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        [formControl]="searchControl"
        placeholder="Search by name, phone..."
        aria-label="Search patients"
      />
      @if (searchControl.value) {
        <button
          mat-icon-button
          matSuffix
          type="button"
          aria-label="Clear search"
          (click)="searchControl.setValue('')"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="patients()"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    [loading]="loading()"
    emptyTitle="No patients found"
    emptyMessage="Try adjusting your search criteria"
    (pageChange)="onPageChange($event)"
    (rowClick)="onRowClick($event)"
  />
</div>
