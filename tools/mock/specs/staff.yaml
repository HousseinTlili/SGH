openapi: 3.0.3
info:
  title: SGH staff service (mock spec for the Angular app)
  description: >-
    Grown phase by phase with the endpoints the Angular screens call. Examples use the ids and names of
    Seed Data and Fixtures. Replaced by contracts/openapi/staff.yaml when the contracts phase is done
    (see tools/mock/README.md).
  version: 0.0.0
servers:
  - url: http://localhost:8086
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: The service process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
              example:
                status: UP
  /api/me:
    get:
      summary: Profile of the logged-in user
      description: >-
        One named example per seeded user. The Angular mock mode sends "Prefer: example=<username>"
        so the answer matches the user who signed in.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [username, roles, staff, patientId]
                properties:
                  username:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  staff:
                    type: object
                    nullable: true
                    properties:
                      id: {type: string}
                      fullName: {type: string}
                      role: {type: string}
                      specialty: {type: string, nullable: true}
                      department: {type: string}
                  patientId:
                    type: string
                    nullable: true
              examples:
                doctor1:
                  value:
                    username: doctor1
                    roles: [DOCTOR]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000001
                      fullName: Amel Trabelsi
                      role: DOCTOR
                      specialty: "Cardiology"
                      department: Cardiology
                    patientId: null
                doctor2:
                  value:
                    username: doctor2
                    roles: [DOCTOR]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000002
                      fullName: Karim Jlassi
                      role: DOCTOR
                      specialty: "General practice"
                      department: General Medicine
                    patientId: null
                nurse1:
                  value:
                    username: nurse1
                    roles: [NURSE]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000003
                      fullName: Sonia Gharbi
                      role: NURSE
                      specialty: null
                      department: Nursing
                    patientId: null
                lab1:
                  value:
                    username: lab1
                    roles: [LAB_TECHNICIAN]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000004
                      fullName: Walid Mansouri
                      role: LAB_TECHNICIAN
                      specialty: null
                      department: Laboratory
                    patientId: null
                pharmacist1:
                  value:
                    username: pharmacist1
                    roles: [PHARMACIST]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000005
                      fullName: Ines Chaabane
                      role: PHARMACIST
                      specialty: null
                      department: Pharmacy
                    patientId: null
                reception1:
                  value:
                    username: reception1
                    roles: [RECEPTIONIST]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000006
                      fullName: Rim Bouazizi
                      role: RECEPTIONIST
                      specialty: null
                      department: Front Desk
                    patientId: null
                admin1:
                  value:
                    username: admin1
                    roles: [ADMIN]
                    staff:
                      id: b2b2b2b2-0000-4000-8000-000000000007
                      fullName: Sami Hamdi
                      role: ADMIN
                      specialty: null
                      department: IT
                    patientId: null
                patient1:
                  value:
                    username: patient1
                    roles: [PATIENT]
                    staff: null
                    patientId: a1a1a1a1-0000-4000-8000-000000000001
  /api/staff/directory:
    get:
      summary: Public staff directory
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffPublic'
              example:
                - id: b2b2b2b2-0000-4000-8000-000000000001
                  fullName: Amel Trabelsi
                  role: DOCTOR
                  specialty: Cardiology
                - id: b2b2b2b2-0000-4000-8000-000000000002
                  fullName: Karim Jlassi
                  role: DOCTOR
                  specialty: General practice
                - id: b2b2b2b2-0000-4000-8000-000000000003
                  fullName: Sonia Gharbi
                  role: NURSE
                  specialty: null
                - id: b2b2b2b2-0000-4000-8000-000000000004
                  fullName: Walid Mansouri
                  role: LAB_TECHNICIAN
                  specialty: null
                - id: b2b2b2b2-0000-4000-8000-000000000005
                  fullName: Ines Chaabane
                  role: PHARMACIST
                  specialty: null
                - id: b2b2b2b2-0000-4000-8000-000000000006
                  fullName: Rim Bouazizi
                  role: RECEPTIONIST
                  specialty: null
                - id: b2b2b2b2-0000-4000-8000-000000000007
                  fullName: Sami Hamdi
                  role: ADMIN
                  specialty: null
  /api/staff/{id}/public:
    get:
      summary: Public profile of a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPublic'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000001
                fullName: Amel Trabelsi
                role: DOCTOR
                specialty: Cardiology
        "404":
          description: Not found
          content:
            application/json:
              example:
                timestamp: "2026-10-12T10:00:00Z"
                status: 404
                error: Not Found
                message: Staff not found
                path: /api/staff/unknown
                correlationId: c1c1c1c1

  /api/staff:
    get:
      summary: List staff members (paged)
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string }
        - name: department
          in: query
          required: false
          schema: { type: string }
        - name: active
          in: query
          required: false
          schema: { type: boolean }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paged list of staff members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedStaff'
              example:
                content:
                  - id: b2b2b2b2-0000-4000-8000-000000000001
                    firstName: Amel
                    lastName: Trabelsi
                    role: DOCTOR
                    specialty: Cardiology
                    department: Cardiology
                    email: doctor1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000002
                    firstName: Karim
                    lastName: Jlassi
                    role: DOCTOR
                    specialty: General practice
                    department: General Medicine
                    email: doctor2@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000003
                    firstName: Sonia
                    lastName: Gharbi
                    role: NURSE
                    specialty: null
                    department: Nursing
                    email: nurse1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000004
                    firstName: Walid
                    lastName: Mansouri
                    role: LAB_TECHNICIAN
                    specialty: null
                    department: Laboratory
                    email: lab1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000005
                    firstName: Ines
                    lastName: Chaabane
                    role: PHARMACIST
                    specialty: null
                    department: Pharmacy
                    email: pharmacist1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000006
                    firstName: Rim
                    lastName: Bouazizi
                    role: RECEPTIONIST
                    specialty: null
                    department: Front Desk
                    email: reception1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                  - id: b2b2b2b2-0000-4000-8000-000000000007
                    firstName: Sami
                    lastName: Hamdi
                    role: ADMIN
                    specialty: null
                    department: IT
                    email: admin1@sgh.local
                    active: true
                    keycloakUserId: null
                    createdAt: "2026-10-01T08:00:00Z"
                    updatedAt: "2026-10-01T08:00:00Z"
                page: 0
                size: 20
                totalElements: 7
                totalPages: 1
    post:
      summary: Create staff profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInput'
            example:
              firstName: Amel
              lastName: Trabelsi
              role: DOCTOR
              specialty: Cardiology
              department: Cardiology
              email: doctor1@sgh.local
              keycloakUserId: null
      responses:
        "201":
          description: Staff profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000001
                firstName: Amel
                lastName: Trabelsi
                role: DOCTOR
                specialty: Cardiology
                department: Cardiology
                email: doctor1@sgh.local
                active: true
                keycloakUserId: null
                createdAt: "2026-10-12T09:00:00Z"
                updatedAt: "2026-10-12T09:00:00Z"
        "409":
          description: Email already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-10-12T09:00:00Z"
                status: 409
                error: Conflict
                message: This e-mail is already used
                path: /api/staff
                correlationId: c-409
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/staff/{id}:
    get:
      summary: Get staff member details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Staff member found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000001
                firstName: Amel
                lastName: Trabelsi
                role: DOCTOR
                specialty: Cardiology
                department: Cardiology
                email: doctor1@sgh.local
                active: true
                keycloakUserId: null
                createdAt: "2026-10-01T08:00:00Z"
                updatedAt: "2026-10-01T08:00:00Z"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Update staff member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInput'
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000001
                firstName: Amel
                lastName: Trabelsi
                role: DOCTOR
                specialty: Cardiology
                department: Cardiology
                email: doctor1@sgh.local
                active: true
                keycloakUserId: null
                createdAt: "2026-10-01T08:00:00Z"
                updatedAt: "2026-10-12T10:00:00Z"
        "409":
          description: Email already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-10-12T09:00:00Z"
                status: 409
                error: Conflict
                message: This e-mail is already used
                path: /api/staff/b2b2b2b2-0000-4000-8000-000000000001
                correlationId: c-409

  /api/staff/{id}/deactivate:
    post:
      summary: Deactivate staff member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Staff deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000001
                firstName: Amel
                lastName: Trabelsi
                role: DOCTOR
                specialty: Cardiology
                department: Cardiology
                email: doctor1@sgh.local
                active: false
                keycloakUserId: null
                createdAt: "2026-10-01T08:00:00Z"
                updatedAt: "2026-10-12T11:00:00Z"
        "409":
          description: Conflict (already deactivated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-10-12T09:00:00Z"
                status: 409
                error: Conflict
                message: Staff member is already deactivated
                path: /api/staff/b2b2b2b2-0000-4000-8000-000000000001/deactivate
                correlationId: c-409

components:
  schemas:
    Staff:
      type: object
      required: [id, firstName, lastName, role, department, email, active, createdAt, updatedAt]
      properties:
        id: { type: string }
        keycloakUserId: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [DOCTOR, NURSE, LAB_TECHNICIAN, PHARMACIST, RECEPTIONIST, ADMIN] }
        specialty: { type: string, nullable: true }
        department: { type: string }
        email: { type: string }
        active: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    StaffInput:
      type: object
      required: [firstName, lastName, role, department, email]
      properties:
        keycloakUserId: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [DOCTOR, NURSE, LAB_TECHNICIAN, PHARMACIST, RECEPTIONIST, ADMIN] }
        specialty: { type: string, nullable: true }
        department: { type: string }
        email: { type: string }
    StaffPublic:
      type: object
      required: [id, fullName, role]
      properties:
        id: { type: string }
        fullName: { type: string }
        role: { type: string }
        specialty: { type: string, nullable: true }
    PagedStaff:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ApiError:
      type: object
      required: [status, error, message, path]
      properties:
        timestamp: { type: string }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
        service: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, problem]
            properties:
              field: { type: string }
              problem: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
