                  - startAt: "2026-10-13T14:00:00Z"
                    endAt: "2026-10-13T14:30:00Z"
                    available: true
                  - startAt: "2026-10-13T14:30:00Z"
                    endAt: "2026-10-13T15:00:00Z"
                    available: true
                  - startAt: "2026-10-13T15:00:00Z"
                    endAt: "2026-10-13T15:30:00Z"
                    available: true
                  - startAt: "2026-10-13T15:30:00Z"
