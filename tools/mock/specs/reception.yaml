                    endAt: "2026-10-13T17:00:00Z"
                    available: true

  /api/invoices:
    get:
      summary: List invoices (paged)
      parameters:
        - name: patientId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paged invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedInvoices'
              example:
                content:
                  - id: e6e6e6e6-0000-4000-8000-000000000001
                    patientId: a1a1a1a1-0000-4000-8000-000000000005
                    appointmentId: e5e5e5e5-0000-4000-8000-000000000004
                    lines:
                      - description: "General consultation"
                        quantity: 1
                        unitPrice: 50.00
                      - description: "Blood tests (HGB, WBC)"
                        quantity: 1
                        unitPrice: 30.00
                    total: 80.00
                    currency: "TND"
                    status: PAID
                    paymentMethod: CASH
                    paidAt: "2026-10-10T12:00:00Z"
                    createdAt: "2026-10-10T11:45:00Z"
                  - id: e6e6e6e6-0000-4000-8000-000000000002
                    patientId: a1a1a1a1-0000-4000-8000-000000000003
                    appointmentId: e5e5e5e5-0000-4000-8000-000000000003
                    lines:
                      - description: "Cardiology consultation"
                        quantity: 1
                        unitPrice: 70.00
                    total: 70.00
                    currency: "TND"
                    status: PENDING
                    paymentMethod: null
                    paidAt: null
                    createdAt: "2026-10-12T09:15:00Z"
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
    post:
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, lines]
              properties:
                patientId: { type: string }
                appointmentId: { type: string, nullable: true }
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/InvoiceLine'
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                id: e6e6e6e6-0000-4000-8000-000000000002
                patientId: a1a1a1a1-0000-4000-8000-000000000003
                appointmentId: e5e5e5e5-0000-4000-8000-000000000003
                lines:
                  - description: "Cardiology consultation"
                    quantity: 1
                    unitPrice: 70.00
                total: 70.00
                currency: "TND"
                status: PENDING
                paymentMethod: null
                paidAt: null
                createdAt: "2026-10-12T09:15:00Z"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/invoices/{id}:
    get:
      summary: Get invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                id: e6e6e6e6-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000005
                appointmentId: e5e5e5e5-0000-4000-8000-000000000004
                lines:
                  - description: "General consultation"
                    quantity: 1
                    unitPrice: 50.00
                  - description: "Blood tests (HGB, WBC)"
                    quantity: 1
                    unitPrice: 30.00
                total: 80.00
                currency: "TND"
                status: PAID
                paymentMethod: CASH
                paidAt: "2026-10-10T12:00:00Z"
                createdAt: "2026-10-10T11:45:00Z"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/invoices/{id}/pay:
    post:
      summary: Mark invoice paid
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [CASH, CARD] }
      responses:
        "200":
          description: Invoice marked paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                id: e6e6e6e6-0000-4000-8000-000000000002
                patientId: a1a1a1a1-0000-4000-8000-000000000003
                appointmentId: e5e5e5e5-0000-4000-8000-000000000003
                lines:
                  - description: "Cardiology consultation"
                    quantity: 1
                    unitPrice: 70.00
                total: 70.00
                currency: "TND"
                status: PAID
                paymentMethod: CASH
                paidAt: "2026-10-12T10:00:00Z"
                createdAt: "2026-10-12T09:15:00Z"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/invoices/{id}/cancel:
    post:
      summary: Cancel invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                id: e6e6e6e6-0000-4000-8000-000000000002
                patientId: a1a1a1a1-0000-4000-8000-000000000003
                appointmentId: e5e5e5e5-0000-4000-8000-000000000003
                lines:
                  - description: "Cardiology consultation"
                    quantity: 1
                    unitPrice: 70.00
                total: 70.00
                currency: "TND"
                status: CANCELLED
                paymentMethod: null
                paidAt: null
                createdAt: "2026-10-12T09:15:00Z"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    Appointment:
      type: object
      required: [id, patientId, patientVerified, doctorId, startAt, endAt, reason, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        patientId: { type: string }
        patientVerified: { type: boolean }
        doctorId: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        reason: { type: string }
        status: { type: string, enum: [SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED] }
        cancelReason: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    AppointmentInput:
      type: object
      required: [patientId, doctorId, startAt, endAt, reason]
      properties:
        patientId: { type: string }
        doctorId: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        reason: { type: string }
    Slot:
      type: object
      required: [startAt, endAt, available]
      properties:
        startAt: { type: string }
        endAt: { type: string }
        available: { type: boolean }
    Availability:
      type: object
      required: [doctorId, date, slots]
      properties:
        doctorId: { type: string }
        date: { type: string }
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    InvoiceLine:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
    Invoice:
      type: object
      required: [id, patientId, lines, total, currency, status, createdAt]
      properties:
        id: { type: string }
        patientId: { type: string }
        appointmentId: { type: string, nullable: true }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total: { type: number }
        currency: { type: string, enum: [TND] }
        status: { type: string, enum: [PENDING, PAID, CANCELLED] }
        paymentMethod: { type: string, nullable: true, enum: [CASH, CARD] }
        paidAt: { type: string, nullable: true }
        createdAt: { type: string }
    PagedAppointments:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    PagedInvoices:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ApiError:
      type: object
      required: [status, error, message, path]
      properties:
        timestamp: { type: string }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
        service: { type: string }
        details:
          type: array
          items:
