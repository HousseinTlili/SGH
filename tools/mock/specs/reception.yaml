                    available: true
                  - startAt: "2026-10-13T11:00:00Z"
                    endAt: "2026-10-13T11:30:00Z"
                    available: true
                  - startAt: "2026-10-13T11:30:00Z"
                    endAt: "2026-10-13T12:00:00Z"
                    available: true
                  - startAt: "2026-10-13T12:00:00Z"
                    endAt: "2026-10-13T12:30:00Z"
                    available: true
                  - startAt: "2026-10-13T12:30:00Z"
                    endAt: "2026-10-13T13:00:00Z"
                    available: true
                  - startAt: "2026-10-13T13:00:00Z"
                    endAt: "2026-10-13T13:30:00Z"
                    available: true
                  - startAt: "2026-10-13T13:30:00Z"
                    endAt: "2026-10-13T14:00:00Z"
