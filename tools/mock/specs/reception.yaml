openapi: 3.0.3
info:
  title: SGH reception service (mock spec for the Angular app)
  description: >-
    Mock specification for reception service. Seeded appointments A1..A5 and invoices INV1..INV2.
  version: 0.0.0
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: The service process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
              example:
                status: UP

  /api/appointments:
    get:
      summary: List appointments (paged)
      parameters:
        - name: doctorId
          in: query
          required: false
          schema: { type: string }
        - name: patientId
          in: query
          required: false
          schema: { type: string }
        - name: date
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paged list of appointments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAppointments'
              example:
                content:
                  - id: e5e5e5e5-0000-4000-8000-000000000001
                    patientId: a1a1a1a1-0000-4000-8000-000000000001
                    patientVerified: true
                    doctorId: b2b2b2b2-0000-4000-8000-000000000001
                    startAt: "2026-10-13T09:00:00Z"
                    endAt: "2026-10-13T09:30:00Z"
                    reason: "Cardiology follow-up"
                    status: SCHEDULED
                    cancelReason: null
                    createdAt: "2026-10-10T08:00:00Z"
                    updatedAt: "2026-10-10T08:00:00Z"
                  - id: e5e5e5e5-0000-4000-8000-000000000002
                    patientId: a1a1a1a1-0000-4000-8000-000000000002
                    patientVerified: true
                    doctorId: b2b2b2b2-0000-4000-8000-000000000002
                    startAt: "2026-10-13T10:00:00Z"
                    endAt: "2026-10-13T10:30:00Z"
                    reason: "General check-up"
                    status: SCHEDULED
                    cancelReason: null
                    createdAt: "2026-10-10T08:30:00Z"
                    updatedAt: "2026-10-10T08:30:00Z"
                  - id: e5e5e5e5-0000-4000-8000-000000000003
                    patientId: a1a1a1a1-0000-4000-8000-000000000003
                    patientVerified: true
                    doctorId: b2b2b2b2-0000-4000-8000-000000000001
                    startAt: "2026-10-12T08:30:00Z"
                    endAt: "2026-10-12T09:00:00Z"
                    reason: "Chest discomfort"
                    status: CHECKED_IN
                    cancelReason: null
                    createdAt: "2026-10-12T08:00:00Z"
                    updatedAt: "2026-10-12T08:25:00Z"
                  - id: e5e5e5e5-0000-4000-8000-000000000004
                    patientId: a1a1a1a1-0000-4000-8000-000000000005
                    patientVerified: true
                    doctorId: b2b2b2b2-0000-4000-8000-000000000002
                    startAt: "2026-10-10T11:00:00Z"
                    endAt: "2026-10-10T11:30:00Z"
                    reason: "Persistent cough"
                    status: COMPLETED
                    cancelReason: null
                    createdAt: "2026-10-09T09:00:00Z"
                    updatedAt: "2026-10-10T11:30:00Z"
                  - id: e5e5e5e5-0000-4000-8000-000000000005
                    patientId: a1a1a1a1-0000-4000-8000-000000000004
                    patientVerified: false
                    doctorId: b2b2b2b2-0000-4000-8000-000000000002
                    startAt: "2026-10-14T14:00:00Z"
                    endAt: "2026-10-14T14:30:00Z"
                    reason: "Routine visit"
                    status: SCHEDULED
                    cancelReason: null
                    createdAt: "2026-10-11T10:00:00Z"
                    updatedAt: "2026-10-11T10:00:00Z"
                page: 0
                size: 20
                totalElements: 5
                totalPages: 1
    post:
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
            example:
              patientId: a1a1a1a1-0000-4000-8000-000000000001
              doctorId: b2b2b2b2-0000-4000-8000-000000000001
              startAt: "2026-10-13T09:00:00Z"
              endAt: "2026-10-13T09:30:00Z"
              reason: "Cardiology follow-up"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000001
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-13T09:00:00Z"
                endAt: "2026-10-13T09:30:00Z"
                reason: "Cardiology follow-up"
                status: SCHEDULED
                cancelReason: null
                createdAt: "2026-10-12T09:00:00Z"
                updatedAt: "2026-10-12T09:00:00Z"
        "409":
          description: Slot conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-10-12T09:00:00Z"
                status: 409
                error: Conflict
                message: This doctor already has an appointment at that time
                path: /api/appointments
                correlationId: c-409
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-10-12T09:00:00Z"
                status: 422
                error: Unprocessable Entity
                message: Validation failed
                path: /api/appointments
                correlationId: c-422
                details:
                  - field: patientId
                    problem: Patient not found

  /api/appointments/{id}:
    get:
      summary: Get appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000001
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-13T09:00:00Z"
                endAt: "2026-10-13T09:30:00Z"
                reason: "Cardiology follow-up"
                status: SCHEDULED
                cancelReason: null
                createdAt: "2026-10-10T08:00:00Z"
                updatedAt: "2026-10-10T08:00:00Z"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Update appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        "200":
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000001
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-13T09:00:00Z"
                endAt: "2026-10-13T09:30:00Z"
                reason: "Cardiology follow-up"
                status: SCHEDULED
                cancelReason: null
                createdAt: "2026-10-10T08:00:00Z"
                updatedAt: "2026-10-12T10:00:00Z"
        "409":
          description: Slot conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/appointments/{id}/check-in:
    post:
      summary: Check in patient
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000001
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-13T09:00:00Z"
                endAt: "2026-10-13T09:30:00Z"
                reason: "Cardiology follow-up"
                status: CHECKED_IN
                cancelReason: null
                createdAt: "2026-10-10T08:00:00Z"
                updatedAt: "2026-10-12T09:00:00Z"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/appointments/{id}/complete:
    post:
      summary: Mark appointment complete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000003
                patientId: a1a1a1a1-0000-4000-8000-000000000003
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-12T08:30:00Z"
                endAt: "2026-10-12T09:00:00Z"
                reason: "Chest discomfort"
                status: COMPLETED
                cancelReason: null
                createdAt: "2026-10-12T08:00:00Z"
                updatedAt: "2026-10-12T09:00:00Z"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/appointments/{id}/cancel:
    post:
      summary: Cancel appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: e5e5e5e5-0000-4000-8000-000000000001
                patientId: a1a1a1a1-0000-4000-8000-000000000001
                patientVerified: true
                doctorId: b2b2b2b2-0000-4000-8000-000000000001
                startAt: "2026-10-13T09:00:00Z"
                endAt: "2026-10-13T09:30:00Z"
                reason: "Cardiology follow-up"
                status: CANCELLED
                cancelReason: "Patient called to cancel"
                createdAt: "2026-10-10T08:00:00Z"
                updatedAt: "2026-10-12T09:00:00Z"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/appointments/availability:
