server.port=${PORT:8086}
spring.application.name=staff-service

# Datasource configuration (Postgres 16, sgh_staff)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgh_staff}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sgh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sgh_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Rule X-8: Resilient boot without failing if DB is offline initially
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway managed programmatically in DbReadyService
spring.flyway.enabled=false

# Keycloak Resource Server JWT validation (lazy JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/sgh/protocol/openid-connect/certs}
sgh.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sgh}

# SpringDoc / Swagger
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.sgh.staff=INFO
logging.level.org.springframework.security=WARN

# Rule X-7: the correlation id is on every log line
logging.pattern.level=%5p [%X{correlationId:-}]
