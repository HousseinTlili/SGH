server.port=0
spring.application.name=staff-service-test

# H2 in-memory DB for unit tests
spring.datasource.url=jdbc:h2:mem:sgh_staff_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway disabled for test suite with H2 (managed by ddl-auto)
spring.flyway.enabled=false
staff.flyway.auto-run=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/sgh/protocol/openid-connect/certs
sgh.keycloak.issuer-uri=http://localhost:8180/realms/sgh
