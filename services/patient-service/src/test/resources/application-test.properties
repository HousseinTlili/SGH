# Tests run against their own database so they never touch the development data
# (the seed check "GET /api/patients returns 8 patients" must keep holding after a test run).
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/sgh_patient_test}
eureka.client.enabled=false
eureka.client.register-with-eureka=false
spring.cloud.config.enabled=false

