spring.application.name=patient-service
server.port=8081

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sgh_patient}
spring.datasource.username=${DATABASE_USERNAME:sgh}
spring.datasource.password=${DATABASE_PASSWORD:sgh_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Rule X-8: Resilient Boot - Hikari does not abort if database is down at boot
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# Disable auto Flyway and auto DDL; DbReadyService handles Flyway and Seed in background retry
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak JWT Configuration
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/sgh}
keycloak.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/sgh/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.issuer}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.jwk-set-uri}

# SpringDoc OpenAPI & Swagger UI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
