# Alembic is driven from app/database.py (run_migrations); this file lets `alembic upgrade head` work from the shell too.
[alembic]
script_location = alembic
# The URL comes from DATABASE_URL (see alembic/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
